<script>
(()=>{
const root=document.getElementById('hmem-ux-refinement');
const ids={workspace:'8128dfd5-6626-4256-9104-0e2d40ec8101',project:'65b76545-e7ba-4ac8-bd3f-eb1e9415dcc1',plan:'14116252-48f4-476e-8684-1bd77927d91f',service:'example-task-service (representative ID)',observation:'example-observation',session:'example-session',audit:'ac12d4b2-9690-4af8-9dae-7135d5eda975'};
const planTitle='Plan WEDL bot architecture and implementation phases';
const serviceTitle='Add isolated WEDL bot service and configuration';
const planDescription='Inspect the existing Discord/Rust/Pi/container architecture and the actual WEDL installation, tool schemas and demo repositories. Specify isolation, three-channel behavior, owner authorization, durable preview approval and publication, Git synchronization with a repository-scoped PAT, model/tool configuration, tool-use guidance, fixture tests, implementation tasks/dependencies and acceptance criteria. Produce a concrete plan without installing software, modifying application source or live configuration, accessing real story credentials, pushing Git content or posting to Discord.';
const serviceDescription='Deliver a separately configured Rust/Pi story-bot entrypoint and lean Docker service with Python >=3.11, Git 2 and a pinned WEDL 1.0 source wheel plus locked dependency hashes. Qualify the selected WEDL revision against its real CLI JSON contract. Give it its own Discord application/token, owner and three disjoint channel IDs, model settings, home, story checkout/native state, operational database and quotas. Initially share only an explicit reference to the existing OpenRouter credential and DeepSeek model/xhigh defaults; allow independent overrides. Use a dedicated WEDL runner/catalog or narrowly extracted isolation plumbing, since the current PiRunner requires Treacle memory tools. Include an ignored .env.wedl and explicitly distributable example template.';
const acceptance='Acceptance: fixture-mode startup/config tests prove secret redaction and no Treacle token/data/volume inheritance, GPU or local-weight dependency. Preserve Treacle behavior in its existing 2 GiB home cap; story checkout and state use separate storage.';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>({projects:'Projects',plan:planTitle,service:serviceTitle,observation:'Observation · src/bot.rs',subject:'Subject · src/bot.rs',sessions:'Session · Plan isolated WEDL story bot',timeline:'Timeline · 1 November',audit:'Audit · Task update',search:'Search · WEDL'})[s];
const tab=s=>({projects:'Projects',plan:'Projects',service:'Projects',observation:'Observations',subject:'Observations',sessions:'Sessions',timeline:'Timeline',audit:'Audit',search:'Projects'})[s];
const link=(scene,text)=>`<a href="#preview=${scene}" data-go="${scene}" class="cursor-interaction">${esc(text)}</a>`;
const button=(action,text,more='')=>`<button type="button" class="cursor-interaction" data-action="${action}" ${more}>${esc(text)}</button>`;
const meta=(id,created='2026-11-01 10:57',updated=created)=>`<footer class="hn-meta"><span>Created: ${created}</span><span>Updated: ${updated}</span><span>UUID: <span>${esc(id)}</span></span></footer>`;
const badge=(text,cls='')=>`<span class="hn-badge ${cls}">${text}</span>`;
const tabs=(state)=>`<div class="hn-tabs">${['Work','Evidence','History'].map(v=>button('detail',v,`data-detail="${v}" aria-pressed="${state.detail===v}"`)).join('')}</div>`;
const fields=rows=>`<dl class="hn-fields">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const activity=()=>`<details><summary class="hn-meta">11:32 · Activity · 21 events</summary><div class="hn-diff">Tool and activity events remain inspectable in the session event inspector. ${link('sessions','Open session and inspect activity')}</div></details>`;
function transcript(){return `<div class="hn-message"><small>11:29 · Assistant</small><p>Approval will cover both the story changes in Git and the Discord post. Scheduled runs will create previews and wait for your approval. I’m finishing the implementation plan and task dependencies; the existing bot is unchanged.</p></div><div class="hn-message"><small>11:31 · Assistant</small><p>WEDL’s apply command creates a local Git commit, so approval must come before apply. The plan binds approval to the story diff and exact Discord post, then pushes the verified commit before publishing. A persistent outbox will track delivery across restarts.</p><p>The eight implementation tasks are recorded. Testing will use fresh demo repositories and simulated Discord/model responses.</p></div>${activity()}`;}
function hierarchy(){return `<h3 class="hn-label">Session hierarchy</h3><div class="hn-session-item" aria-current="true"><b class="hn-live">● Plan isolated WEDL story bot</b><small>[unknown] unknown:unknown:unknown</small><small>Last activity · 11:32</small></div><div class="hn-child"><div class="hn-session-item"><b>● Coordinate WEDL story bot planning</b><small>Parent: Plan isolated WEDL story bot</small><small>[orchestrator] codex:gpt-6.1-sol:high</small><small>Last activity · 11:33</small></div></div>`;}
function work(state,scene){if(state.detail==='History'&&scene!=='service')return '<div class="hn-content"><h3>Entity history</h3><p class="hn-prose">The supplied screenshots do not show this task’s own History tab. Production retains its complete existing history.</p></div>';if(state.detail==='History')return `<div class="hn-content"><h3>Entity history</h3><div class="hn-item">${badge('UPDATED')}<small>2026-11-01 11:33 · Model orchestrator · codex:gpt-6.1-sol:high</small><div class="hn-diff"><span>auto blocked: <s>true</s> → false</span><span>Status: <s>blocked</s> → todo</span></div>${link('audit','Browse workspace audit')}</div><details><summary>Created · 2026-11-01 11:26</summary>${fields([['Title',scene==='service'?serviceTitle:planTitle],['Status','todo'],['Priority',scene==='service'?'8':'5'],['Project ID',ids.project],['Parent ID','null'],['Completed at','—'],['auto blocked','false']])}</details></div>`;
if(state.detail==='Evidence')return `<div class="hn-content"><h3>Linked evidence</h3><div class="hn-item">${link('observation','Observation · src/bot.rs')}<small>Representative observation destination · content and immutable provenance stay together.</small></div>${scene==='plan'?`<div class="hn-item">${link('sessions','Session · Plan isolated WEDL story bot')}<small>Live · runtime identity unknown</small></div>`:'<small>Session association for this task is not supplied by the screenshots.</small>'}</div>`;
return `<div class="hn-content"><div class="hn-row hn-between"><h3>Dependencies</h3><small>${scene==='service'?'1 prerequisite':'No open prerequisites'}</small></div>${scene==='service'?`<div class="hn-item">${badge('IN PROGRESS')}${link('plan',planTitle)}<small>Prerequisite · same project</small></div>`:`<small>Ready to start.</small>`}<div class="hn-section-row"><h3>${scene==='service'?'Project':'Dependent work'}</h3>${link(scene==='service'?'projects':'service',scene==='service'?'WEDL Story Discord Bot':serviceTitle)}<small>Related work opens as a new focus step; it is never inserted into the parent hierarchy.</small></div><div class="hn-section-row"><h3>Observations</h3>${link('observation','Open observation · src/bot.rs')}</div><div class="hn-row">${button('subtask','+ Subtask')}</div></div>`;}
function task(state,scene){const isService=scene==='service';return `<article class="hn-card hn-focused"><header class="hn-head"><div class="hn-task-title">${badge('TSK','hn-type')}<h2>${isService?serviceTitle:planTitle}</h2></div><div class="hn-actions">${isService?button('agents','Sessions unspecified','disabled'):button('agents',state.agents?'<- Hide Agents':'View Agents ->')}${button('move','Move')}${badge(isService?'BLOCKED':'IN PROGRESS',isService?'hn-blocked':'')}${badge(isService?'P8':'P5')}${button('delete','Delete','')}</div></header><div class="hn-content hn-prose"><p>${isService?serviceDescription:planDescription}</p>${isService?`<p>${acceptance}</p>`:''}</div>${tabs(state)}${state.agents&&!isService?`<div class="hn-dock"><section class="hn-pane"><h3>Work</h3>${work(state,scene)}</section><section class="hn-pane hn-reader"><h3>Plan isolated WEDL story bot</h3><small>[unknown] unknown:unknown:unknown</small>${transcript()}${link('sessions','Open full session ↗')}</section><aside class="hn-pane">${hierarchy()}</aside></div>`:work(state,scene)}${meta(isService?ids.service:ids.plan)}</article>`;}
function projects(state){return `<div class="hn-row">${button('expand','Expand All')}${button('collapse','Collapse All')}${button('new','+ New Project')}</div><article class="hn-card"><header class="hn-head"><div class="hn-task-title">${badge('PRJ')}<h2>WEDL Story Discord Bot</h2></div><div class="hn-actions">${badge('ACTIVE','hn-active')}${badge('P5')}</div></header><div class="hn-content"><small>9 tasks · 8 blocked tasks · 14 open dependencies</small><p class="hn-prose">Add an independently configured WEDL story bot in a second container, with a Git-backed story workspace, private control and preview channels, and explicit owner approval before immutable story updates are published. Begin with fixture demo repositories and the existing OpenRouter credential and DeepSeek model defaults.</p><div class="hn-row">${link('plan','Focus planning task')}${button('new','+ Subproject')}${button('new','+ Task')}</div></div>${meta(ids.project)}</article><article class="hn-card"><header class="hn-head"><div class="hn-task-title">${badge('TSK','hn-type')}${link('plan',planTitle)}</div>${badge('IN PROGRESS')}${badge('P5')}</header>${state.expanded?`<div class="hn-content hn-prose">${planDescription}</div>`:''}${meta(ids.plan)}</article><article class="hn-card"><header class="hn-head"><div class="hn-task-title">${badge('TSK','hn-type')}${link('service',serviceTitle)}</div>${badge('BLOCKED','hn-blocked')}${badge('P8')}</header><div class="hn-content"><small>1 open dependency</small>${state.expanded?`<div class="hn-prose"><p>${serviceDescription}</p><p>${acceptance}</p></div>`:''}</div>${meta(ids.service)}</article>`;}

root.querySelectorAll('.hn-app').forEach((app,index)=>{
 const state={scene:'projects',detail:'Work',agents:false,expanded:false,query:'',history:[],future:[],notice:'',dense:false};
 const snapshot=()=>({scene:state.scene,detail:state.detail,agents:state.agents,expanded:state.expanded,query:state.query,forms:JSON.parse(JSON.stringify(state.forms||{}))});
 const apply=s=>Object.assign(state,s);
 const restoreWidget=saved=>{const v=saved?.privateContent;if(v?.design===app.dataset.design&&['projects','plan','service','observation','subject','sessions','timeline','audit','search'].includes(v.view)){state.scene=v.view;state.detail=['Work','Evidence','History'].includes(v.detail)?v.detail:'Work';state.agents=Boolean(v.agents);}};
 restoreWidget(window.openai?.widgetState);
 window.addEventListener('openai:set_globals',e=>{restoreWidget(e.detail?.globals?.widgetState);render();});
 function go(scene){if(scene===state.scene)return;state.history.push(snapshot());if(state.history.length>32)state.history.shift();state.future=[];state.scene=scene;state.notice='';render();save();}
 function back(){if(!state.history.length)return;state.future.push(snapshot());apply(state.history.pop());state.notice='Returned to the previous view.';render();save();}
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:app.dataset.design,view:state.scene},privateContent:{design:app.dataset.design,view:state.scene,detail:state.detail,agents:state.agents}}).catch(()=>{});}
 function location(){const scene=state.scene;const prev=state.history.at(-1);const structure=['plan','service'].includes(scene)?`${link('projects','WEDL Story Discord Bot')} <span>›</span> <span>${esc(label(scene))}</span>`:scene==='projects'?'<span>Projects</span>':scene==='sessions'?'<span>Sessions</span> <span>›</span> <span>Plan isolated WEDL story bot</span>':['subject','observation'].includes(scene)?`<span>Observations</span> <span>›</span> <span>${scene==='subject'?'Subject Tree · src/bot.rs':'Observation'}</span>`:`<span>${esc(tab(scene))}</span>`;
 const returning=`<div class="hn-return">${button('back',prev?'← Back to '+label(prev.scene):'← Back',state.history.length?'':'disabled')}${button('forward','Forward →',state.future.length?'':'disabled')}<small>${state.history.length?'Return trail · '+state.history.length+' '+(state.history.length===1?'step':'steps'):'Opened directly · no previous view'}</small></div>`;
 return `<div class="hn-location"><nav class="hn-path" aria-label="Location"><span class="hn-label">Location</span> ${link('projects','Treacletart Discord Bot')} <span>›</span> ${structure}</nav>${app.dataset.design==='strip'?`${returning}${state.history.length?`<details class="hn-journey"><summary>Earlier views</summary><ol>${state.history.map((s,i)=>`<li>${button('return-index',label(s.scene),`data-index="${i}"`)}</li>`).join('')}</ol></details>`:''}`:`<details class="hn-journey" ${prev?'open':''}><summary>${prev?'Journey · return to '+esc(label(prev.scene)):'Journey · opened directly'}</summary>${returning}${state.history.length?`<ol>${state.history.map((s,i)=>`<li>${button('return-index',label(s.scene),`data-index="${i}"`)}</li>`).join('')}</ol>`:''}</details>`}</div>`;}
 function render(){app.dataset.dense=String(state.dense);app.innerHTML=`<header class="hn-mast"><span class="hn-brand">hmem</span><b>Workspaces</b><small>Treacletart Discord Bot · Design proposal</small><span class="hn-account">LOCAL SESSION · Local User</span></header><div class="hn-layout"><aside class="hn-rail" aria-label="Workspaces preview"><span class="hn-group">AI tool · 4</span><a href="#preview=projects" data-action="workspace-preview">ADRAI</a><a href="#preview=projects" data-action="workspace-preview">Codex Configuration</a><a href="#preview=projects" data-action="workspace-preview">Pi Harness Customization</a><a href="#preview=projects" data-action="workspace-preview">hmem</a><span class="hn-group">Story automation · 2</span><a href="#preview=projects" data-action="workspace-preview">Wedl Project</a><a href="#preview=projects" data-action="workspace-preview">World Demo</a><span class="hn-group">Writ-development · 4</span><a href="#preview=projects" data-action="workspace-preview">Hyperspace</a><a href="#preview=projects" data-action="workspace-preview">Writ Online</a><a href="#preview=projects" data-action="workspace-preview">topo</a><a href="#preview=projects" data-action="workspace-preview">writ</a><span class="hn-group">Workspaces</span><a href="#preview=projects" data-action="workspace-preview">Sable Relay feature-world</a><a href="#preview=projects" data-go="projects" aria-current="page">Treacletart Discord Bot · <span class="hn-live">●</span></a><a href="#preview=projects" data-action="workspace-preview">Wargame</a><a href="#preview=projects" data-action="workspace-preview">open-facet</a><a href="#preview=projects" data-action="workspace-preview">stack-mcp</a><span class="hn-connected">● Connected</span><details class="hn-mobile-workspaces"><summary>Switch workspace</summary><p>Preview keeps the selected workspace.</p><select aria-label="Workspace picker"><option>Treacletart Discord Bot</option><option>ADRAI</option><option>Codex Configuration</option><option>Pi Harness Customization</option><option>hmem</option><option>Wedl Project</option><option>World Demo</option><option>Hyperspace</option><option>Writ Online</option><option>topo</option><option>writ</option><option>Sable Relay feature-world</option><option>Wargame</option><option>open-facet</option><option>stack-mcp</option></select></details></aside><div><section class="hn-context"><div class="hn-row hn-between"><div class="hn-row">${badge('REPOSITORY')}<h1>Treacletart Discord Bot</h1></div>${button('delete','Delete workspace','')}</div><small>1 open project · 9 open tasks · 4 observations</small><div class="hn-meta"><span>UUID: ${ids.workspace}</span><span>Created: 2026-10-31 20:08</span><span>Updated: 2026-10-31 20:08</span></div><nav class="hn-tabs" aria-label="Workspace sections">${['Projects','Sessions','Observations','Timeline','Audit'].map(t=>button('workspace-tab',t,`data-scene="${({Projects:'projects',Sessions:'sessions',Observations:'subject',Timeline:'timeline',Audit:'audit'})[t]}" aria-pressed="${tab(state.scene)===t}"`)).join('')}</nav><label>Search all entities<input data-query value="${esc(state.query)}" placeholder="Search all entities…"></label>${tab(state.scene)==='Projects'?`<label>Filter focused view<input placeholder="Filter focused view…" value="${esc(state.filter||'')}"></label><div class="hn-row"><span class="hn-label">Show</span><select aria-label="Show entities"><option>All</option><option>Projects</option><option>Tasks</option></select><label><input type="checkbox" checked> Show empty projects</label><span class="hn-label">Project</span><select aria-label="Project status"><option>Active + Paused</option><option>Active</option><option>Paused</option><option>Completed</option><option>Archived</option></select><span class="hn-label">Task</span><select aria-label="Task status"><option>Todo + In Progress + Blocked</option><option>Todo</option><option>In Progress</option><option>Blocked</option><option>Done</option><option>Cancelled  const forms=state.forms?.[state.scene];if(forms)app.querySelectorAll('input,select').forEach((el,i)=>{if(forms[i]!==undefined){if(el.type==='checkbox')el.checked=forms[i];else el.value=forms[i];}});
 app.querySelectorAll('.hn-chart').forEach(svg=>{const width=svg.getBoundingClientRect().width;const right=Math.max(110,width-26);const x0=42;const x1=(right+x0)/2;const lines=svg.querySelectorAll('path');if(lines[0])lines[0].setAttribute('d',`M${x0} 55H${right}M${x0} 100H${right}M${x0} 145H${right}M${x0} 190H${right}`);if(lines[1])lines[1].setAttribute('d',`M${x0} 190L${x1} 190L${right} 55`);if(lines[2])lines[2].setAttribute('d',`M${x0} 190L${x1} 190L${right} 110`);});
 }
 render();
 app.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go);return;}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();const action=b.dataset.action;if(action==='back')back();else if(action==='forward'){state.history.push(snapshot());apply(state.future.pop());render();save();}else if(action==='return-index'){const i=Number(b.dataset.index);const target=state.history[i];state.future=[];state.history=state.history.slice(0,i);apply(target);render();save();}else if(action==='workspace-tab')go(b.dataset.scene);else if(action==='detail'){state.detail=b.dataset.detail;render();save();}else if(action==='agents'){state.agents=!state.agents;render();save();}else if(action==='expand'||action==='collapse'){state.expanded=action==='expand';render();}else if(action==='subject')go('subject');else if(action==='observations')go('observation');else if(action==='close-session')back();else if(action==='series'){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));}else{state.notice=({'workspace-preview':'Workspace switch preview: production retains every workspace destination. This example stays in Treacletart Discord Bot.',delete:'Design preview: the existing delete confirmation and permissions remain required.',move:'Design preview: the existing Move dialog retains the same destination tree and permissions.',advanced:'Design preview: existing advanced observation controls remain available.',new:'Design preview: existing creation forms remain available.',subtask:'Design preview: existing subtask creation remains available.'})[action]||'';render();}});
 app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-query]')){state.query=e.target.value;go('search');}});
 const captureForms=()=>{state.forms=state.forms||{};state.forms[state.scene]=Array.from(app.querySelectorAll('input,select'),el=>el.type==='checkbox'?el.checked:el.value);};
 app.addEventListener('input',e=>{if(e.target.matches('[data-query]'))state.query=e.target.value;captureForms();});
 app.addEventListener('change',captureForms);
 if(globalThis.ResizeObserver)new ResizeObserver(()=>{app.querySelectorAll('.hn-chart').forEach(svg=>{const width=svg.getBoundingClientRect().width;const right=Math.max(110,width-26);const x0=42,x1=(right+x0)/2;const paths=svg.querySelectorAll('path');paths[0]?.setAttribute('d',`M${x0} 55H${right}M${x0} 100H${right}M${x0} 145H${right}M${x0} 190H${right}`);paths[1]?.setAttribute('d',`M${x0} 190L${x1} 190L${right} 55`);paths[2]?.setAttribute('d',`M${x0} 190L${x1} 190L${right} 110`);});}).observe(app);
 if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addToggle(state,'dense',{label:'Compact content spacing'});tweak.addToggle(state,'agents',{label:'Agents visible'});}
});
})();
