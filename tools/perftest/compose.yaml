# Throwaway performance environment for tools/perftest/perftest.mjs; see
# docs/reference/request-performance.md ("Container sample").
#
# Secrets live outside the repository in .tmp/perftest/secrets.env (gitignored),
# three random hex values, one KEY=value per line:
#   POSTGRES_PASSWORD, HMEM_API_KEY, HMEM_AUTH_LOCAL_USER_TOKEN
# PERFTEST_SECRETS overrides that path and PERFTEST_IMAGE the server image.
# Pass the same file as --env-file so POSTGRES_PASSWORD is interpolated below:
#   docker compose -p hmem-perftest -f tools/perftest/compose.yaml --env-file .tmp/perftest/secrets.env up -d
# Teardown:
#   docker compose -p hmem-perftest -f tools/perftest/compose.yaml --env-file .tmp/perftest/secrets.env down
#   docker volume rm hmem-perftest-pgdata
# Never use project name "hmem"; never point this at a live database. perftest.mjs
# refuses a server that is not published on 127.0.0.1 and reads the server log
# from the /var/lib/hmem tmpfs.
name: hmem-perftest

services:
  postgres:
    image: postgres:17-bookworm
    container_name: hmem-perftest-postgres
    restart: "no"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.max=5000", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_DB: hmem
      POSTGRES_USER: hmem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    ports:
      - "127.0.0.1:15433:5432"
    networks: [perftest]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmem -d hmem"]
      interval: 5s
      timeout: 5s
      retries: 20

  hmem:
    # Built separately from the repository Dockerfile with hmem.perftest.* labels;
    # perftest.mjs reads hmem.perftest.revision from the image this container runs.
    image: ${PERFTEST_IMAGE:-hmem-perftest:8d5101d0}
    container_name: hmem-perftest-server
    restart: "no"
    init: true
    stop_signal: SIGINT
    stop_grace_period: 180s
    read_only: true
    env_file:
      - path: ${PERFTEST_SECRETS:-../../.tmp/perftest/secrets.env}
        required: true
    environment:
      HMEM_DB_HOST: postgres
      HMEM_DB_PORT: "5432"
      HMEM_DB_NAME: hmem
      HMEM_DB_USER: hmem
      HMEM_DB_PASSWORD: ${POSTGRES_PASSWORD}
      HMEM_DB_SSLMODE: disable
      HMEM_SERVER_HOST: 0.0.0.0
      HMEM_SERVER_PORT: "8420"
      HMEM_SERVER_URL: http://127.0.0.1:8420
      HMEM_AUTH_MODE: local
      HMEM_AUTH_ENABLED: "true"
      HMEM_EMBEDDING_PROVIDER: disabled
      HMEM_POOL_SIZE: "15"
      HMEM_POOL_DELIVERY_SIZE: "10"
      HMEM_POOL_IDLE_TIMEOUT: "60"
      HMEM_POOL_STATEMENT_TIMEOUT_MS: "30000"
      HMEM_LOG_LEVEL: info
      HMEM_LOG_MAX_SIZE_MB: "15"
      HMEM_LOG_BACKUP_COUNT: "5"
    tmpfs:
      - /var/lib/hmem:size=128m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
      - /tmp:size=64m,uid=10001,gid=10001,mode=1770,noexec,nosuid,nodev
      - /run/hmem:size=64m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:18429:8420"
    networks: [perftest]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: hmem-perftest-pgdata

networks:
  perftest:
    name: hmem-perftest-net
